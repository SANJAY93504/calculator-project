<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header>
            <h1>Calculator</h1>

            <button id="themeBtn" onclick="toggleTheme()">
                🌙
            </button>
        </header>


        <!-- Calculator -->
        <div class="calculator">

            <!-- Display -->
            <div class="display-box">

                <div id="previousDisplay"></div>

                <input
                    type="text"
                    id="display"
                    value="0"
                    readonly
                >

            </div>


            <!-- Buttons -->
            <div class="buttons">

                <button class="function" onclick="clearDisplay()">
                    AC
                </button>

                <button class="function" onclick="deleteLast()">
                    DEL
                </button>

                <button class="operator" onclick="addValue('%')">
                    %
                </button>

                <button class="operator" onclick="addValue('/')">
                    ÷
                </button>


                <button onclick="addValue('7')">7</button>
                <button onclick="addValue('8')">8</button>
                <button onclick="addValue('9')">9</button>

                <button class="operator" onclick="addValue('*')">
                    ×
                </button>


                <button onclick="addValue('4')">4</button>
                <button onclick="addValue('5')">5</button>
                <button onclick="addValue('6')">6</button>

                <button class="operator" onclick="addValue('-')">
                    −
                </button>


                <button onclick="addValue('1')">1</button>
                <button onclick="addValue('2')">2</button>
                <button onclick="addValue('3')">3</button>

                <button class="operator" onclick="addValue('+')">
                    +
                </button>


                <button class="zero" onclick="addValue('0')">
                    0
                </button>

                <button onclick="addValue('.')">
                    .
                </button>

                <button class="equal" onclick="calculate()">
                    =
                </button>

            </div>

        </div>


        <!-- History -->
        <div class="history">

            <div class="history-header">
                <h2>Calculation History</h2>

                <button onclick="clearHistory()">
                    Clear
                </button>
            </div>

            <div id="historyList">
                <p class="empty">
                    No calculations yet
                </p>
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
